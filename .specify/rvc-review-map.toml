# Read-only adapter mapping, not a new feature or a copy of the requirements.
version = 1
mode = "existing-sasd-artifacts"
contract = "docs/verification/review-contract.md"
output_root = "artifacts/Review"

[roles]
spec = ["docs/preliminary_requirements.md", "docs/requirements_clarifications.md"]
plan = ["artifacts/SA/event_list.md", "artifacts/SA/context_diagram.md", "artifacts/SA/DFD/dfd_level_0.md", "artifacts/SA/DFD/dfd_level_1.md", "artifacts/SA/DFD/dfd_level_2.md", "artifacts/SA/DFD/dfd_level_3.md", "artifacts/SA/DFD/dfd_level_4_fsm.md", "artifacts/SA/data_dictionary.md", "artifacts/SA/process_specification.md", "artifacts/SD/transform_analysis.md", "artifacts/SD/structure_chart.md"]
evidence_indexes = ["artifacts/Implementation/module_traceability.md", "artifacts/Implementation/test_report.md", "artifacts/Implementation/coverage_report.md", "artifacts/SystemTest/requirement_traceability.md", "artifacts/SystemTest/test_scenarios.md", "artifacts/SystemTest/test_results.md"]
rules = ["AGENTS.md", "docs/verification/review-contract.md"]

[identifiers]
requirements = ["B1", "B2", "B3", "B4", "B5", "B6", "B7", "C1", "C2", "C3", "C4", "C5", "C6", "C7", "C8", "C9", "C10", "C11", "C12", "C13", "C14", "C15", "C16"]
assumptions = []
fsm = ["T0", "T1", "T2", "T3", "T4", "T5", "T6", "T7", "T8", "T9", "T10", "T11", "T12", "T13", "T14"]

[implementation]
source_dir = "src"
interface_dir = "include"
unit_test_dir = "tests"
simulator_dir = "simulator"
build_file = "CMakeLists.txt"

[coverage]
unit = "requirement-to-artifact-evidence"
task_coverage = "not-applicable-no-historical-tasks-invented"
notes = "B6/B7 are scope constraints; assess with boundary evidence. Do not require every requirement to have a state transition or a C function. Q6 is resolved by owner-confirmed C16; count C16 once and preserve Q6 as historical question provenance. Re-enumerate IDs from current sources and flag stale mappings."
